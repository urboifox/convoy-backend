services:
  postgres:
    image: postgres:16-alpine
    container_name: convoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convoy
      POSTGRES_PASSWORD: convoy
      POSTGRES_DB: convoy
    ports:
      - "5432:5432"
    volumes:
      - convoy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  convoy_pg:
