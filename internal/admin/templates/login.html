<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Convoy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">
    <form method="post" action="/admin/login" class="w-full max-w-sm px-8 py-10 border border-white/15">
        <div class="flex items-center gap-3 mb-8">
            <span class="font-extrabold uppercase tracking-tight text-lg">Convoy</span>
            <span class="text-white/40 text-xs uppercase tracking-widest ml-auto">Admin</span>
        </div>
        <label class="block text-xs uppercase tracking-widest text-white/40 mb-2">Password</label>
        <input
            type="password"
            name="password"
            autofocus
            autocomplete="current-password"
            class="w-full bg-transparent border border-white/30 focus:border-white text-white px-3 py-3 outline-none mb-4"
        />
        {{ if .Error }}
            <p class="text-xs text-red-400 mb-3">Wrong password.</p>
        {{ end }}
        <button class="w-full bg-white text-black py-3 uppercase tracking-widest text-xs font-bold active:opacity-80" type="submit">
            Sign in
        </button>
    </form>
</body>
</html>
