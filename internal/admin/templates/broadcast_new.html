{{ define "content" }}
<section class="max-w-2xl">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-extrabold uppercase tracking-tight">New broadcast</h1>
        <a href="/admin/broadcasts" class="text-xs uppercase tracking-widest text-white/40 hover:text-white">← Back</a>
    </div>

    <form
        hx-post="/admin/broadcasts"
        hx-target="#result"
        hx-swap="innerHTML"
        hx-disabled-elt="find button[type=submit]"
        class="border border-white/15 p-6 space-y-5"
    >
        <div>
            <label class="block text-xs uppercase tracking-widest text-white/40 mb-2">Title</label>
            <input
                name="title"
                type="text"
                maxlength="80"
                required
                placeholder="Convoy update"
                class="w-full bg-transparent border border-white/30 focus:border-white text-white px-3 py-2 outline-none"
            />
        </div>
        <div>
            <label class="block text-xs uppercase tracking-widest text-white/40 mb-2">Body</label>
            <textarea
                name="body"
                maxlength="240"
                required
                rows="4"
                placeholder="Say something concise — push notifications get cropped fast."
                class="w-full bg-transparent border border-white/30 focus:border-white text-white px-3 py-2 outline-none resize-none"
            ></textarea>
        </div>
        <div class="flex items-center justify-between">
            <div
                class="text-xs uppercase tracking-widest text-white/40"
                hx-get="/admin/partials/recipient-count"
                hx-trigger="load, every 10s"
                hx-swap="innerHTML"
            >
                <span>{{ .Count }} devices</span>
            </div>
            <button type="submit" class="bg-white text-black px-5 py-2 uppercase tracking-widest text-xs font-bold active:opacity-80 disabled:opacity-50">
                Send
            </button>
        </div>
    </form>

    <div id="result" class="mt-6"></div>
</section>
{{ end }}
